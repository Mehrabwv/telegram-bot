; Weather display for the Telegram bot: Seeed XIAO ESP32-S3 + 2" ST7789 screen.
;
; In VS Code (open THIS folder, esp32-display), use the buttons in the blue bar
; at the bottom: checkmark = Build, arrow = Upload to the board, plug = Serial Monitor.

[env:xiao_esp32s3]
; Pinned: newer versions need Python packages that have no Windows-on-ARM build
platform = espressif32 @ 6.13.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    bblanchon/ArduinoJson @ ^7.2.1
    tzapu/WiFiManager @ ^2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=1
